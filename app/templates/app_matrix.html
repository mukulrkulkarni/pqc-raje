<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><title>Matrix input</title></head><body><main class="container"><h1>Matrix input</h1><p>Step 2 of 4: submit a CSV, NPY, or NPZ matrix.</p>{% if error %}<p role="alert"><strong>Correct this input:</strong> {{ error }}</p>{% endif %}
<h2>Expected criteria</h2><ol>{% for criterion in criteria %}<li>{{ criterion.name }}</li>{% endfor %}</ol>
<form method="post" action="{{ url_for('workflow.preview') }}" enctype="multipart/form-data">
<fieldset><legend>Matrix source</legend><label for="matrix_csv">Paste CSV</label><br><textarea id="matrix_csv" name="matrix_csv" rows="10" cols="80"></textarea><p>Or select a file:</p><label for="matrix_file">CSV, NPY, or NPZ file</label><input id="matrix_file" name="matrix_file" type="file" accept=".csv,.npy,.npz"></fieldset>
<fieldset><legend>CSV header mapping</legend><label><input type="radio" name="header_mode" value="headered" required checked> Headered: identifier then exact criterion names in order</label><label><input type="radio" name="header_mode" value="headerless"> Headerless: numeric criterion columns in criteria order</label></fieldset>
<fieldset><legend>Missing CSV scores</legend><label><input type="checkbox" name="approve_missing" value="yes"> I approve replacement of missing score cells</label><label for="missing_replacement">Replacement, from 0 to 1</label><input id="missing_replacement" name="missing_replacement" value="0" type="number" min="0" max="1" step="any"></fieldset><button type="submit">Validate and preview</button></form></main></body></html>
