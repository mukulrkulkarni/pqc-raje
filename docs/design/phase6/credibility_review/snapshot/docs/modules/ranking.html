<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'unsafe-inline';">
<meta name="color-scheme" content="light dark">
<title>ranking.py</title>
<style>
:root{--bg:#ffffff;--text:#0f172a;--text-dim:#64748b;--border:#e2e8f0;--surface:#f8fafc;--accent:#2563eb;--radius:8px;--s3:12px;--s4:16px;--s5:24px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
html[data-theme="dark"]{--bg:#0b1120;--text:#e2e8f0;--text-dim:#9ca3af;--border:#1e293b;--surface:#0f172a;--accent:#60a5fa;}
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);} 
.main{max-width:900px;margin:0 auto;padding:var(--s5);} 
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--s4);} 
.h{margin:0 0 var(--s3);font-size:18px;letter-spacing:-.02em;}
.p{margin:0 0 var(--s3);color:var(--text-dim);line-height:1.55;}
.a{color:var(--accent);text-decoration:none;}
.a:hover{text-decoration:underline;}
.code{font-family:var(--mono);}
</style>
</head>
<body>
<main class="main">
  <section class="card">
    <h1 class="h">ranking.py</h1>
    <p class="p">Net-flow ranking utilities. Project contract: rank by raw net flow (descending).</p>
    <p class="p">Deep tutorial: <a class="a" href="/docs/modules/ranking/tutorial">/docs/modules/ranking/tutorial</a> (served) or <span class="code">ranking_tutorial_side_by_side.html</span> (offline).</p>
  </section>
</main>
</body>
</html>
