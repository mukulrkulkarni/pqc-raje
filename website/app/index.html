<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; style-src 'unsafe-inline';">
<title>ELECTRE III App</title>
<style>
:root{--bg:#ffffff;--text:#0f172a;--dim:#475569;--border:#e2e8f0;--surface:#f8fafc;--accent:#2563eb;--radius:10px;--s3:12px;--s4:16px;--s5:24px;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
.main{max-width:980px;margin:0 auto;padding:var(--s5);} 
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--s5);} 
.h{margin:0 0 var(--s3);font-size:20px;letter-spacing:-.02em;}
.p{margin:0 0 var(--s4);color:var(--dim);line-height:1.6;}
.a{color:var(--accent);text-decoration:none;font-weight:600;}
.a:hover{text-decoration:underline;}
.nav{display:flex;gap:14px;margin:0 0 var(--s4);} 
.nav a{color:var(--dim);text-decoration:none;font-weight:600;}
.nav a:hover{color:var(--text);}
</style>
</head>
<body>
<main class="main">
  <nav class="nav" aria-label="Primary">
    <a href="/index.html">Getting Started</a>
    <a href="/app/index.html" aria-current="page">App</a>
    <a href="/modules/index.html">Tutorials</a>
  </nav>
  <section class="card">
    <h1 class="h">Web application</h1>
    <p class="p">Use the app to upload a matrix, confirm the preview, and start a ranking run.</p>
    <p class="p"><a class="a" href="https://app.pqcmig.scoring.draft/">Open app →</a></p>
    <p class="p">If your deployment uses a different domain, edit <code>website/site-config.json</code> and rebuild.</p>
  </section>
</main>
</body>
</html>
